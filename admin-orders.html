<!DOCTYPE html>
<html>
<head>
<title>admin orders</title>
</head>
<body>

<h2>all orders (admin)</h2>
<div id="orders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
});

const db = getFirestore();
const box = document.getElementById("orders");

const snap = await getDocs(collection(db,"orders"));

snap.forEach(d=>{
  const o = d.data();
  box.innerHTML += `
    <div style="border:1px solid #000;padding:10px;margin:10px">
      <p>name: ${o.name}</p>
      <p>phone: ${o.phone}</p>
      <p>status: <b>${o.status}</b></p>

      <button onclick="send('${o.phone}','order received')">order received</button>
      <button onclick="send('${o.phone}','shipped')">shipped</button>
      <button onclick="send('${o.phone}','out for delivery')">out for delivery</button>
      <button onclick="send('${o.phone}','delivered')">delivered</button>
    </div>
  `;
});
</script>

<script>
function send(phone,status){
  const msg =
    "your order status update%0a" +
    "status: " + status + "%0a" +
    "ajgar auto parts";

  window.open(
    "https://wa.me/" + phone + "?text=" + msg,
    "_blank"
  );
}
</script>

</body>
</html>
