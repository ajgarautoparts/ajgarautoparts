<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>profile</title>
<style>
body{font-family:arial;background:#f6f7fb;padding:20px}
.box{background:#fff;padding:15px;border-radius:8px}
button{padding:10px 14px;margin-top:10px}
</style>
</head>

<body>

<h2>my profile</h2>

<div class="box">
  <p id="email"></p>
  <button onclick="logout()">logout</button>
  <br><br>
  <a href="my-orders.html">my orders</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
});

const auth = getAuth();

onAuthStateChanged(auth,user=>{
  if(!user){
    location.href="login.html";
    return;
  }
  document.getElementById("email").innerText =
    "logged in as: " + user.email;
});

window.logout = ()=>{
  signOut(auth).then(()=>location.href="index.html");
}
</script>

</body>
</html>
