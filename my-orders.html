<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>my orders</title>
<style>
body{font-family:arial;background:#f6f7fb;padding:20px}
.order{background:#fff;padding:12px;margin-bottom:10px;border-radius:6px}
</style>
</head>

<body>

<h2>my orders</h2>
<div id="orders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
});

const db = getFirestore();
const auth = getAuth();
const box = document.getElementById("orders");

onAuthStateChanged(auth, async user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const q = query(
    collection(db,"orders"),
    where("email","==",user.email)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    box.innerHTML = "<p>no orders yet</p>";
    return;
  }

  snap.forEach(d=>{
    const o = d.data();
    box.innerHTML += `
      <div class="order">
        <p><b>status:</b> ${o.status}</p>
        <p><b>payment:</b> ${o.payment}</p>
      </div>
    `;
  });
});
</script>

</body>
</html>
