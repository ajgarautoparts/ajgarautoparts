<h2>MY ORDERS</h2>
<div id="myOrders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = localStorage.getItem("loggedUser");
const box = document.getElementById("myOrders");

const q = query(collection(db,"orders"), where("phone","!=", ""));
const snap = await getDocs(q);

snap.forEach(d=>{
  const o = d.data();
  box.innerHTML += `
    <div style="border:1px solid #000;padding:10px;margin:10px">
      <p>NAME: ${o.name}</p>
      <p>STATUS: <b>${o.status}</b></p>
    </div>
  `;
});
<script>
function sendStatus(phone, status){
  const msg =
    "YOUR ORDER STATUS UPDATE%0A" +
    "STATUS: " + status + "%0A" +
    "AJGAR AUTO PARTS";

  window.open(
    "https://wa.me/" + phone + "?text=" + msg,
    "_blank"
  );
}
</script>
