<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>my orders | ajgar auto parts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:arial;
  background:#f6f7fb;
  padding:20px;
}
h2{margin-bottom:15px}
.order{
  background:#fff;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border-left:5px solid #0f172a;
}
.order p{margin:4px 0}
.empty{
  text-align:center;
  margin-top:40px;
  font-size:18px;
}
</style>
</head>

<body>

<h2>my orders</h2>
<div id="orders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const box = document.getElementById("orders");

onAuthStateChanged(auth, async user=>{
  if(!user){
    alert("please login first");
    location.href="login.html";
    return;
  }

  const q = query(
    collection(db,"orders"),
    where("email","==",user.email)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    box.innerHTML = `<div class="empty">no orders yet</div>`;
    return;
  }

  snap.forEach(d=>{
    const o = d.data();

    box.innerHTML += `
      <div class="order">
        <p><b>order id:</b> ${d.id}</p>
        <p><b>status:</b> ${o.status}</p>
        <p><b>payment:</b> ${o.payment}</p>
        ${o.total ? `<p><b>amount:</b> ₹${o.total}</p>` : ``}
        ${o.time?.seconds ? `<p><b>date:</b> ${new Date(o.time.seconds*1000).toLocaleString()}</p>` : ``}
      </div>
    `;
  });
});
</script>

</body>
</html>
