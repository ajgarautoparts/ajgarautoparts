<!DOCTYPE html>
<html>
<head>
  <title>my orders</title>
</head>
<body>

<h2>my orders</h2>
<div id="myOrders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const box = document.getElementById("myOrders");

const q = query(collection(db,"orders"));
const snap = await getDocs(q);

snap.forEach(d=>{
  const o = d.data();

  box.innerHTML += `
    <div style="border:1px solid #000;padding:10px;margin:10px">
      <p>name: ${o.name}</p>
      <p>phone: ${o.phone}</p>
      <p>status: <b>${o.status}</b></p>

      <button onclick="sendStatus('${o.phone}','order received')">
        order received
      </button>

      <button onclick="sendStatus('${o.phone}','shipped')">
        shipped
      </button>

      <button onclick="sendStatus('${o.phone}','out for delivery')">
        out for delivery
      </button>

      <button onclick="sendStatus('${o.phone}','delivered')">
        delivered
      </button>
    </div>
  `;
});
</script>

<script>
function sendStatus(phone, status){
  const msg =
    "your order status update%0a" +
    "status: " + status + "%0a" +
    "ajgar auto parts";

  window.open(
    "https://wa.me/" + phone + "?text=" + msg,
    "_blank"
  );
}
</script>

</body>
</html>
