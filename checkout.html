<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>checkout | ajgar auto parts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: arial;
  background:#f6f7fb;
  padding:20px;
}
h2{margin-bottom:15px}
.box{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
input{
  width:100%;
  padding:10px;
  margin-top:8px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:6px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.save{
  background:#2563eb;
  color:#fff;
}
.cod{
  background:#0f172a;
  color:#fff;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>add new address</h2>

<div class="box">
  <h3>contact details</h3>
  <input id="name" placeholder="name">
  <input id="phone" placeholder="mobile number">
</div>

<div class="box">
  <h3>delivery address</h3>
  <input id="pincode" placeholder="pin code">
  <input id="house" placeholder="house / block">
  <input id="street" placeholder="street / locality">
  <input id="town" placeholder="town">
  <input id="city" placeholder="city">
  <input id="state" placeholder="state">
</div>

<button class="save" onclick="saveAddress()">save address</button>
<button class="cod" onclick="placeCod()">cash on delivery</button>

<!-- firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, 
  addDoc, 
  collection 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { 
  getAuth, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* save address */
window.saveAddress = ()=>{
  const address = {
    name: name.value,
    phone: phone.value,
    pincode: pincode.value,
    house: house.value,
    street: street.value,
    town: town.value,
    city: city.value,
    state: state.value
  };

  localStorage.setItem("address", JSON.stringify(address));
  alert("address saved");
};

/* place cod order */
window.placeCod = async()=>{
  const user = auth.currentUser;
  if(!user){
    alert("please login first");
    location.href="login.html";
    return;
  }

  const address = JSON.parse(localStorage.getItem("address"));
  const cart = JSON.parse(
    localStorage.getItem("cart_" + user.email)
  ) || [];

  if(!address || cart.length === 0){
    alert("address or cart empty");
    return;
  }

  const total = cart.reduce(
    (t,p)=> t + (p.price * p.qty), 0
  );

  await addDoc(collection(db,"orders"),{
    email: user.email,
    products: cart,        // 🔥 full product details
    total: total,
    address: address,
    payment: "cod",
    status: "pending",
    time: new Date()
  });

  localStorage.removeItem("cart_" + user.email);
  localStorage.removeItem("address");

  alert("order placed successfully");
  location.href="index.html";
};
</script>

</body>
</html>
