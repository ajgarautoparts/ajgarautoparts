<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CHECKOUT | AJGAR AUTO PARTS</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:Arial, sans-serif;
      padding:20px;
    }
    input{
      width:100%;
      padding:10px;
      margin-bottom:10px;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:6px;
      font-size:16px;
      cursor:pointer;
    }
    .cod{
      background:#16a34a;
      color:#fff;
    }
    .rzp{
      background:#0f172a;
      color:#fff;
    }
  </style>
</head>

<body>

<h2>CHECKOUT</h2>

<input id="name" placeholder="NAME">
<input id="phone" placeholder="PHONE">
<input id="address" placeholder="ADDRESS">

<h3>TOTAL: ₹<span id="total">0</span></h3>

<button class="cod" onclick="placeCOD()">CASH ON DELIVERY</button>
<button class="rzp" onclick="payOnline()">PAY ONLINE (RAZORPAY)</button>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== LOAD CART TOTAL ===== */
const user = localStorage.getItem("loggedUser");
const cartKey = user ? "cart_" + user : "cart_guest";
const cart = JSON.parse(localStorage.getItem(cartKey)) || [];

let total = 0;
cart.forEach(p => total += p.price * p.qty);
document.getElementById("total").innerText = total;

/* ===== COD ORDER ===== */
window.placeCOD = async () => {
  if(!name.value || !phone.value || !address.value){
    alert("FILL ALL DETAILS");
    return;
  }

  await addDoc(collection(db,"orders"),{
    name: name.value,
    phone: phone.value,
    address: address.value,
    items: cart,
    total: total,
    payment: "COD",
    status: "pending",
    time: new Date()
  });

  localStorage.removeItem(cartKey);
  alert("ORDER PLACED (COD)");
  location.href = "index.html";
};
</script>

<!-- ================= RAZORPAY ================= -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
function payOnline(){
  if(!name.value || !phone.value || !address.value){
    alert("FILL ALL DETAILS");
    return;
  }

  const options = {
    key: "rzp_test_SJYEnKpL9b7Y7Y",   // <-- ETA TOMAR KEY
    amount: total * 100,
    currency: "INR",
    name: "AJGAR AUTO PARTS",
    description: "ORDER PAYMENT",
    handler: function (response){
      saveOnlineOrder(response.razorpay_payment_id);
    }
  };

  new Razorpay(options).open();
}

async function saveOnlineOrder(paymentId){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
  const { getFirestore, addDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");

  const app = initializeApp({
    apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
    authDomain: "ajgar-auto-parts.firebaseapp.com",
    projectId: "ajgar-auto-parts"
  });

  const db = getFirestore(app);

  await addDoc(collection(db,"orders"),{
    name: name.value,
    phone: phone.value,
    address: address.value,
    items: cart,
    total: total,
    payment: "RAZORPAY",
    paymentId: paymentId,
    status: "paid",
    time: new Date()
  });

  localStorage.removeItem(cartKey);
  alert("PAYMENT SUCCESS");
  location.href = "index.html";
}
</script>

</body>
</html>
