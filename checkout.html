<!DOCTYPE html>
<html>
<head>
  <title>checkout</title>
  <style>
    body{
      font-family: arial;
      background:#f6f6f6;
      padding:20px;
    }
    .box{
      background:#fff;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
    }
    input{
      width:100%;
      padding:10px;
      margin-top:8px;
      margin-bottom:12px;
      border:1px solid #ccc;
      border-radius:6px;
    }
    button{
      padding:12px;
      width:100%;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }
    .save{
      background:#ff4f6d;
      color:#fff;
    }
    .cod{
      background:#333;
      color:#fff;
      margin-top:10px;
    }
  </style>
</head>

<body>

<h2>add new address</h2>

<div class="box">
  <h3>contact details</h3>
  <input id="name" placeholder="name*">
  <input id="phone" placeholder="mobile no*">
</div>

<div class="box">
  <h3>address</h3>
  <input id="pincode" placeholder="pin code*">
  <input id="house" placeholder="house number / block*">
  <input id="street" placeholder="address (street, locality)*">
  <input id="town" placeholder="locality / town*">
  <input id="city" placeholder="city / district*">
  <input id="state" placeholder="state*">
</div>

<button class="save" onclick="saveAddress()">save & continue</button>
<button class="cod" onclick="placeCod()">cash on delivery</button>

<!-- firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveAddress = ()=>{
  localStorage.setItem("address", JSON.stringify({
    name:name.value,
    phone:phone.value,
    pincode:pincode.value,
    house:house.value,
    street:street.value,
    town:town.value,
    city:city.value,
    state:state.value
  }));
  alert("address saved");
};

window.placeCod = async()=>{
  const a = JSON.parse(localStorage.getItem("address"));
  if(!a){ alert("please save address first"); return; }

  await addDoc(collection(db,"orders"),{
    ...a,
    payment:"cod",
    status:"pending",
    time:new Date()
  });

  alert("order placed successfully");
  localStorage.removeItem("address");
  location.href="index.html";
};
<script>
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(showPosition, errorLocation);
  }else{
    alert("location not supported");
  }
}

function showPosition(position){
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;

  street.value = "latitude: " + lat + ", longitude: " + lon;

  window.open(
    "https://www.google.com/maps?q=" + lat + "," + lon,
    "_blank"
  );
}

function errorLocation(){
  alert("location permission denied");
}
</script>

</body>
</html>
