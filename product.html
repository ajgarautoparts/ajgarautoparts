<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRODUCT DETAILS | AJGAR AUTO PARTS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:arial;
  background:#f6f7fb;
  padding:20px;
}
.card{
  background:#fff;
  max-width:420px;
  margin:auto;
  padding:20px;
  border-radius:12px;
}
.card img{
  width:100%;
  border-radius:10px;
}
h2{margin:15px 0 5px}
.price{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}
.desc{
  font-size:14px;
  color:#555;
  margin-bottom:15px;
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.cart{
  background:#0f172a;
  color:#fff;
}
.buy{
  background:#16a34a;
  color:#fff;
}
</style>
</head>

<body>

<!-- PRODUCT CARD -->
<div class="card product-card"
  id="productCard"
  data-name=""
  data-price=""
  data-image="">

  <img id="pImg">

  <h2 id="pName"></h2>
  <div class="price" id="pPrice"></div>

  <div class="desc" id="pDesc"></div>

  <button class="add-to-cart-btn cart">ADD TO CART</button>
  <button class="buy-now-btn buy">BUY NOW</button>
</div>

<!-- SCRIPT: URL THEKE DATA LOAD -->
<script>
const params = new URLSearchParams(window.location.search);

const name  = params.get("name")  || "Black Rally Hand Guards";
const price = params.get("price") || "999";
const image = params.get("image") || "img/handguard.jpg";
const desc  = params.get("desc")  || 
  "High quality hand guards for protection and style. Compatible with most bikes.";

document.getElementById("pName").innerText  = name;
document.getElementById("pPrice").innerText = "₹" + price;
document.getElementById("pDesc").innerText  = desc;
document.getElementById("pImg").src         = image;

const card = document.getElementById("productCard");
card.dataset.name  = name;
card.dataset.price = price;
card.dataset.image = image;
</script>

<!-- EXISTING CART / BUY LOGIC -->
<script type="module" src="script.js"></script>

</body>
</html>
