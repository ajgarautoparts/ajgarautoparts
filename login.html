<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Ajgar Auto Parts</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;display:flex;background:#f8fafc}

.left{
  width:50%;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px
}
.left h1{font-size:40px;margin-bottom:15px}
.left p{opacity:.85;margin-bottom:25px}
.left ul{list-style:none}
.left ul li{margin-bottom:10px}

.right{
  width:50%;
  display:flex;
  justify-content:center;
  align-items:center
}

.login-box{
  background:#fff;
  width:100%;
  max-width:380px;
  padding:35px;
  border-radius:14px;
  box-shadow:0 20px 40px rgba(0,0,0,.12)
}
.login-box h2{margin-bottom:8px}
.login-box p{font-size:14px;color:#64748b;margin-bottom:20px}

input{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  font-size:14px
}

.password-box{position:relative}
.password-box span{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:13px;
  color:#475569
}

button{
  width:100%;
  padding:12px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:15px
}
button:hover{background:#1e293b}

.google-btn{
  background:#fff;
  color:#000;
  border:1px solid #cbd5e1;
  margin-top:12px
}
.google-btn:hover{background:#f1f5f9}

.alt{text-align:center;margin:12px 0;font-size:14px;color:#64748b}

.msg{
  text-align:center;
  font-size:14px;
  margin-bottom:10px;
  color:#dc2626
}

@media(max-width:768px){
  body{flex-direction:column}
  .left{display:none}
  .right{width:100%}
}
</style>
</head>

<body>

<div class="left">
  <h1>Ajgar Auto Parts</h1>
  <p>Secure login for customers.</p>
  <ul>
    <li>✔ Firebase Authentication</li>
    <li>✔ Secure Checkout</li>
    <li>✔ Order Tracking</li>
    <li>✔ Mobile Friendly</li>
  </ul>
</div>

<div class="right">
  <div class="login-box">
    <h2>Welcome Back</h2>
    <p>Login to continue</p>

    <div id="msg" class="msg"></div>

    <input type="email" id="email" placeholder="Email">

    <div class="password-box">
      <input type="password" id="password" placeholder="Password (min 6 chars)">
      <span id="togglePass">show</span>
    </div>

    <button id="loginBtn">Login</button>

    <div class="alt">or</div>

    <button id="registerBtn" style="background:#16a34a">Register</button>

    <button id="googleBtn" class="google-btn">Continue with Google</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const email = document.getElementById("email");
const password = document.getElementById("password");
const msg = document.getElementById("msg");

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const googleBtn = document.getElementById("googleBtn");

/* already logged in */
onAuthStateChanged(auth,user=>{
  if(user){
    location.href="index.html";
  }
});

/* show / hide password */
document.getElementById("togglePass").onclick = ()=>{
  if(password.type === "password"){
    password.type="text";
    togglePass.innerText="hide";
  }else{
    password.type="password";
    togglePass.innerText="show";
  }
};

/* login */
loginBtn.onclick = async ()=>{
  msg.innerText="";
  if(!email.value || !password.value){
    msg.innerText="email and password required";
    return;
  }
  try{
    await signInWithEmailAndPassword(auth,email.value,password.value);
    location.href="index.html";
  }catch(e){
    msg.innerText="login failed";
  }
};

/* register */
registerBtn.onclick = async ()=>{
  msg.innerText="";
  if(password.value.length < 6){
    msg.innerText="password minimum 6 characters";
    return;
  }
  try{
    await createUserWithEmailAndPassword(auth,email.value,password.value);
    location.href="index.html";
  }catch(e){
    msg.innerText="registration failed";
  }
};

/* google */
googleBtn.onclick = async ()=>{
  try{
    await signInWithPopup(auth,provider);
    location.href="index.html";
  }catch(e){
    msg.innerText="google login failed";
  }
};
</script>

</body>
</html>
