<!DOCTYPE html>
<html>
<head>
  <title>ADMIN PANEL</title>
  <style>
    body{font-family:arial;padding:20px}
    .order{border:1px solid #ccc;padding:10px;margin-bottom:10px}
    select{padding:5px}
  </style>
</head>
<body>

<h2>ALL ORDERS</h2>
<div id="orders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ordersDiv = document.getElementById("orders");
const snap = await getDocs(collection(db,"orders"));

snap.forEach(d=>{
  const o = d.data();
  ordersDiv.innerHTML += `
    <div class="order">
      <b>${o.name}</b><br>
      ${o.phone}<br>
      PAYMENT: ${o.payment}<br>
      STATUS:
      <select onchange="updateStatus('${d.id}',this.value)">
        <option ${o.status=="pending"?"selected":""}>pending</option>
        <option ${o.status=="delivered"?"selected":""}>delivered</option>
        <option ${o.status=="cancelled"?"selected":""}>cancelled</option>
      </select>
      <br>
      <button onclick="downloadInvoice('${d.id}')">invoice</button>
    </div>
  `;
});

window.updateStatus = async(id,status)=>{
  await updateDoc(doc(db,"orders",id),{status});
  alert("status updated");
};
</script>

<script src="invoice.js"></script>
</body>
</html>
