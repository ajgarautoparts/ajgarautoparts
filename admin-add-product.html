<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Product | Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:arial;
  background:#f6f7fb;
  padding:20px;
}
.box{
  background:#fff;
  max-width:480px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}
input,textarea,select{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:6px;
}
label{
  font-size:14px;
  font-weight:bold;
  display:block;
  margin-bottom:4px;
}
button{
  width:100%;
  padding:12px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.preview{
  width:100%;
  height:200px;
  border:1px dashed #ccc;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.preview img{
  max-width:100%;
  max-height:100%;
}
.row{
  display:flex;
  gap:10px;
}
.row > div{
  flex:1;
}
</style>
</head>

<body>

<h2>Add New Product (Admin)</h2>

<div class="box">

  <label>Product name</label>
  <input id="name">

  <label>Price</label>
  <input id="price">

  <label>Offer price (optional)</label>
  <input id="offer">

  <label>Stock quantity</label>
  <input id="stock">

  <label>Image url</label>
  <input id="image" oninput="previewImage()">

  <div class="preview" id="preview">Image preview</div>

  <label>Category</label>
  <select id="category">
    <option value="">Select category</option>
    <option value="engine">Engine</option>
    <option value="protection">Protection</option>
    <option value="seats">Seats</option>
    <option value="bodywork">Bodywork</option>
    <option value="luggage">Luggage</option>
    <option value="electrical">Electrical</option>
  </select>

  <label>Description</label>
  <textarea id="desc"></textarea>

  <div class="row">
    <div>
      <label>Featured</label>
      <select id="featured">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </div>

    <div>
      <label>Status</label>
      <select id="status">
        <option value="active">Active</option>
        <option value="hidden">Hidden</option>
      </select>
    </div>
  </div>

  <button id="addBtn">Add product</button>
</div>

<!-- Image preview script -->
<script>
function previewImage(){
  const url = document.getElementById("image").value;
  const box = document.getElementById("preview");

  if(url && url.startsWith("http")){
    box.innerHTML = `<img src="${url}">`;
  }else{
    box.innerHTML = "Image preview";
  }
}
</script>

<!-- Firebase + add product -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection, serverTimestamp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function addProduct(){

  const name = nameEl.value.trim();
  const price = priceEl.value.trim();
  const offer = offerEl.value.trim();
  const stock = stockEl.value.trim();
  const image = imageEl.value.trim();
  const category = categoryEl.value;
  const desc = descEl.value.trim();
  const featured = featuredEl.value;
  const status = statusEl.value;

  if(!name || !price || !image || !category || !stock){
    alert("Please fill all required fields");
    return;
  }

  await addDoc(collection(db,"products"),{
    name,
    price:Number(price),
    offerPrice: offer ? Number(offer) : null,
    stock:Number(stock),
    image,
    category,
    description:desc,
    featured: featured==="yes",
    status,
    created: serverTimestamp()
  });

  alert("Product added successfully");
}

const nameEl = document.getElementById("name");
const priceEl = document.getElementById("price");
const offerEl = document.getElementById("offer");
const stockEl = document.getElementById("stock");
const imageEl = document.getElementById("image");
const categoryEl = document.getElementById("category");
const descEl = document.getElementById("desc");
const featuredEl = document.getElementById("featured");
const statusEl = document.getElementById("status");

document.getElementById("addBtn")
  .addEventListener("click", addProduct);
</script>

</body>
</html>
