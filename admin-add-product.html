<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ADD PRODUCT | ADMIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:arial;
  background:#f6f7fb;
  padding:20px;
}
.box{
  background:#fff;
  max-width:420px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}
input,textarea,select{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>ADD NEW PRODUCT (ADMIN)</h2>

<div class="box">
  <input id="name" placeholder="PRODUCT NAME">
  <input id="price" placeholder="PRICE">

  <!-- IMAGE UPLOAD -->
  <input type="file" id="imageFile" accept="image/*">

  <select id="category">
    <option value="">SELECT CATEGORY</option>
    <option value="engine">ENGINE</option>
    <option value="protection">PROTECTION</option>
    <option value="seats">SEATS</option>
    <option value="bodywork">BODYWORK</option>
    <option value="luggage">LUGGAGE</option>
    <option value="electrical">ELECTRICAL</option>
  </select>

  <textarea id="desc" placeholder="DESCRIPTION"></textarea>

  <button onclick="addProduct()">ADD PRODUCT</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts",
  storageBucket: "ajgar-auto-parts.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.addProduct = async () => {

  const file = document.getElementById("imageFile").files[0];

  if(!name.value || !price.value || !file || !category.value){
    alert("ALL FIELDS REQUIRED");
    return;
  }

  /* UPLOAD IMAGE */
  const imgRef = ref(
    storage,
    "products/" + Date.now() + "_" + file.name
  );

  await uploadBytes(imgRef, file);
  const imageURL = await getDownloadURL(imgRef);

  /* SAVE PRODUCT */
  await addDoc(collection(db,"products"),{
    name: name.value,
    price: Number(price.value),
    image: imageURL,
    category: category.value,
    description: desc.value,
    created: serverTimestamp()
  });

  alert("PRODUCT ADDED SUCCESSFULLY");

  name.value="";
  price.value="";
  imageFile.value="";
  category.value="";
  desc.value="";
};
</script>

</body>
</html>
