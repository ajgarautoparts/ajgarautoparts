<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>add product | admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:arial;
  background:#f6f7fb;
  padding:20px;
}
.box{
  background:#fff;
  max-width:480px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}
input,textarea,select{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:6px;
}
label{
  font-size:14px;
  font-weight:bold;
  display:block;
  margin-bottom:4px;
}
button{
  width:100%;
  padding:12px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.preview{
  width:100%;
  height:200px;
  border:1px dashed #ccc;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.preview img{
  max-width:100%;
  max-height:100%;
}
.row{
  display:flex;
  gap:10px;
}
.row > div{
  flex:1;
}
</style>
</head>

<body>

<h2>add new product (admin)</h2>

<div class="box">

  <label>product name</label>
  <input id="name" placeholder="product name">

  <label>price</label>
  <input id="price" placeholder="price">

  <label>offer price (optional)</label>
  <input id="offer" placeholder="offer price">

  <label>stock quantity</label>
  <input id="stock" placeholder="stock (example: 10)">

  <label>image url</label>
  <input id="image" placeholder="paste image url" oninput="previewImage()">

  <div class="preview" id="preview">image preview</div>

  <label>category</label>
  <select id="category">
    <option value="">select category</option>
    <option value="engine">engine</option>
    <option value="protection">protection</option>
    <option value="seats">seats</option>
    <option value="bodywork">bodywork</option>
    <option value="luggage">luggage</option>
    <option value="electrical">electrical</option>
  </select>

  <label>description</label>
  <textarea id="desc" placeholder="product description"></textarea>

  <div class="row">
    <div>
      <label>featured</label>
      <select id="featured">
        <option value="no">no</option>
        <option value="yes">yes</option>
      </select>
    </div>

    <div>
      <label>status</label>
      <select id="status">
        <option value="active">active</option>
        <option value="hidden">hidden</option>
      </select>
    </div>
  </div>

  <button onclick="addProduct()">add product</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addProduct = async () => {

  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const offer = document.getElementById("offer").value.trim();
  const stock = document.getElementById("stock").value.trim();
  const image = document.getElementById("image").value.trim();
  const category = document.getElementById("category").value;
  const desc = document.getElementById("desc").value.trim();
  const featured = document.getElementById("featured").value;
  const status = document.getElementById("status").value;

  if (!name || !price || !image || !category || !stock) {
    alert("PLEASE FILL ALL REQUIRED FIELDS");
    return;
  }

  await addDoc(collection(db, "products"), {
    name: name,
    price: Number(price),
    offerPrice: offer ? Number(offer) : null,
    stock: Number(stock),
    image: image,
    category: category,
    description: desc,
    featured: featured === "yes",
    status: status,
    created: serverTimestamp()
  });

  alert("✅ PRODUCT ADDED SUCCESSFULLY");

  document.querySelectorAll("input, textarea, select").forEach(el => el.value = "");
};
<script>
function previewImage(){
  const url = document.getElementById("image").value.trim();
  const box = document.getElementById("preview");

  if(!url){
    box.innerHTML = "image preview";
    return;
  }

  box.innerHTML = `<img src="${url}" onerror="this.parentNode.innerHTML='invalid image url'">`;
}
</script>

</body>
</html>
