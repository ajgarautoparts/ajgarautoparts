<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CART | AJGAR AUTO PARTS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial, sans-serif;
      padding:20px;
      background:#f8fafc;
    }
    h2{margin-bottom:10px}
    .item{
      background:#fff;
      padding:10px;
      margin-bottom:10px;
      border-radius:6px;
    }
    .total{
      font-size:18px;
      margin-top:15px;
      font-weight:bold;
    }
    button{
      padding:12px 18px;
      background:#0f172a;
      color:#fff;
      border:none;
      border-radius:6px;
      cursor:pointer;
      margin-top:15px;
    }
  </style>
</head>

<body>

<h2>YOUR CART</h2>

<div id="cart-items"></div>

<div class="total" id="total"></div>

<a href="checkout.html">
  <button>PROCEED TO CHECKOUT</button>
</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const cartBox = document.getElementById("cart-items");
const totalBox = document.getElementById("total");

onAuthStateChanged(auth, user => {

  if(!user){
    alert("PLEASE LOGIN FIRST");
    location.href = "login.html";
    return;
  }

  const cartKey = "cart_" + user.email;
  const cart = JSON.parse(localStorage.getItem(cartKey)) || [];

  if(cart.length === 0){
    cartBox.innerHTML = "<p>CART IS EMPTY</p>";
    totalBox.innerText = "TOTAL: ₹0";
    return;
  }

  let total = 0;
  cartBox.innerHTML = "";

  cart.forEach(p => {
    const price = p.price * p.qty;
    total += price;

    cartBox.innerHTML += `
      <div class="item">
        <strong>${p.name}</strong><br>
        QTY: ${p.qty}<br>
        PRICE: ₹${price}
      </div>
    `;
  });

  totalBox.innerText = "TOTAL: ₹" + total;
});
</script>

</body>
</html>
