<!DOCTYPE html>
<html>
<head>
  <title>CART | AJGAR AUTO PARTS</title>
</head>
<body>

<h2>YOUR CART</h2>

<div id="cart-items"></div>

<h3 id="total"></h3>

<a href="checkout.html">
  <button>PROCEED TO CHECKOUT</button>
</a>

<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const cartBox = document.getElementById("cart-items");
const totalBox = document.getElementById("total");

onAuthStateChanged(auth, user => {
  if(!user){
    location.href="login.html";
    return;
  }

  const cart = JSON.parse(localStorage.getItem("cart_"+user.email)) || [];
  let total = 0;

  cart.forEach(p=>{
    total += p.price * p.qty;
    cartBox.innerHTML += `
      <p>${p.name} × ${p.qty} = ₹${p.price*p.qty}</p>
    `;
  });

  totalBox.innerText = "TOTAL: ₹"+total;
});
</script>

</body>
</html>
