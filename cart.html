<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cart | ajgar auto parts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:arial;
  background:#f6f7fb;
  padding:15px;
}
h2{margin-bottom:15px}
.cart-item{
  background:#fff;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
}
.cart-item img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:6px;
}
.row{
  display:flex;
  gap:10px;
}
.qty-btn{
  padding:4px 10px;
  margin:0 5px;
}
.remove{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:5px;
  cursor:pointer;
}
.total{
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
}
.checkout{
  margin-top:20px;
  width:100%;
  padding:14px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.empty{
  text-align:center;
  margin-top:40px;
  font-size:18px;
}
</style>
</head>

<body>

<h2>your cart</h2>

<div id="cart"></div>
<div class="total" id="total"></div>

<button class="checkout" onclick="goCheckout()">proceed to checkout</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvJ1h4CYZFr9h20O5zaxN6eoJtsQQypqs",
  authDomain: "ajgar-auto-parts.firebaseapp.com",
  projectId: "ajgar-auto-parts"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const box = document.getElementById("cart");
const totalBox = document.getElementById("total");

let cartKey = "";
let cart = [];

onAuthStateChanged(auth, user=>{
  if(!user){
    alert("please login first");
    location.href="login.html";
    return;
  }

  cartKey = "cart_" + user.email;
  cart = JSON.parse(localStorage.getItem(cartKey)) || [];
  render();
});

function save(){
  localStorage.setItem(cartKey, JSON.stringify(cart));
  render();
}

function render(){
  if(cart.length === 0){
    box.innerHTML = `<div class="empty">cart is empty</div>`;
    totalBox.innerText = "total: ₹0";
    return;
  }

  let total = 0;
  box.innerHTML = "";

  cart.forEach((p,i)=>{
    total += p.price * p.qty;

    box.innerHTML += `
      <div class="cart-item">
        <div class="row">
          <img src="${p.image}">
          <div>
            <b>${p.name}</b><br>
            price: ₹${p.price}<br>
            qty:
            <button class="qty-btn" onclick="dec(${i})">-</button>
            ${p.qty}
            <button class="qty-btn" onclick="inc(${i})">+</button>
            <br><br>
            <button class="remove" onclick="removeItem(${i})">remove</button>
          </div>
        </div>
      </div>
    `;
  });

  totalBox.innerText = "total: ₹" + total;
}

window.inc = i=>{
  cart[i].qty++;
  save();
}

window.dec = i=>{
  if(cart[i].qty > 1){
    cart[i].qty--;
  }
  save();
}

window.removeItem = i=>{
  cart.splice(i,1);
  save();
}

window.goCheckout = ()=>{
  if(cart.length === 0){
    alert("cart empty");
    return;
  }
  location.href="checkout.html";
}
</script>

</body>
</html>
